# -- 🚀 Netlify Configuration pour HailiteManager

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.11.0"

# -- Plugin Next.js (requis pour App Router + API routes sur Netlify)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# -- Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[context.develop]
  command = "npm run dev"

[context.branch-deploy]
  command = "npm run build"

[context.production]
  command = "npm run build"
